<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameRoute · live arrival</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --ink:#141824; --dim:#5c6370; --accent:#5B2BD6; --gold:#F59F00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:#f3f1ec; }
  #map { position:fixed; inset:0; }
  .card { position:fixed; left:12px; right:12px; bottom:12px; max-width:520px; margin:0 auto; background:#fff; border-radius:20px;
          box-shadow:0 8px 30px rgba(0,0,0,.18); padding:16px 18px; z-index:1000; }
  .top { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.06em; }
  .dot { width:9px; height:9px; border-radius:5px; background:#2fb36b; box-shadow:0 0 0 0 rgba(47,179,107,.6); animation:pulse 1.8s infinite; }
  .dot.off { background:#aaa; animation:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(47,179,107,.6)} 70%{box-shadow:0 0 0 10px rgba(47,179,107,0)} 100%{box-shadow:0 0 0 0 rgba(47,179,107,0)} }
  h1 { margin:6px 0 2px; font-size:34px; line-height:1.1; }
  .sub { color:var(--dim); font-size:15px; }
  .dest { font-weight:600; font-size:17px; margin-top:6px; }
  .note { color:var(--dim); font-size:12px; margin-top:8px; }
  .wait { padding:30px 0; text-align:center; color:var(--dim); }
</style>
</head>
<body>
<div id="map"></div>
<div class="card" id="card"><div class="wait">Connecting…</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// GameRoute posts the driver's position and arrival time to a private ntfy.sh topic named in the
// link (#topic.key); this page shows the latest one and follows new ones live. Nothing is stored here.
const enc = new TextEncoder(), dec = new TextDecoder();
function unb64(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
// Messages are end-to-end encrypted (AES-GCM, "e1." + base64url(iv + data)); the key is only in this link.
async function openMsg(key, msg) {
  if (!key || !msg || !msg.startsWith("e1.")) return null;
  try { const b = unb64(msg.slice(3)); return dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, key, b.slice(12))); }
  catch (e) { return null; }
}
let chain = Promise.resolve();
function feed(m) { chain = chain.then(() => take(m)).catch(() => {}); } // keep messages in order
const [topic, keyText] = (location.hash || "").slice(1).replace(/[^A-Za-z0-9_.-]/g, "").split(".");
let key = null;
const card = document.getElementById("card");
const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([37.98, 23.73], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
const car = L.circleMarker([0, 0], { radius: 9, color: "#fff", weight: 3, fillColor: "#5B2BD6", fillOpacity: 1 });
const dest = L.circleMarker([0, 0], { radius: 8, color: "#fff", weight: 3, fillColor: "#F59F00", fillOpacity: 1 });
let last = null, fitted = false;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function clock(ms) { return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
function dist(m) { return m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + " km" : Math.round(m / 10) * 10 + " m"; }

function render() {
  if (!last) return;
  const ago = Math.round((Date.now() - last.ts) / 1000);
  const stale = ago > 180;
  let head, big, sub;
  if (last.state === "arrived") { head = "ARRIVED"; big = "Arrived ✓"; sub = "at " + clock(last.ts); }
  else if (last.state === "stopped") { head = "SHARING ENDED"; big = "—"; sub = "The driver stopped sharing"; }
  else {
    const mins = Math.max(1, Math.round((last.eta - Date.now()) / 60000));
    head = stale ? "LAST KNOWN" : "ON THE WAY · LIVE"; big = clock(last.eta); sub = mins + " min · " + dist(last.left) + " to go";
  }
  card.innerHTML = '<div class="top"><span class="dot' + (stale || last.state !== "driving" ? " off" : "") + '"></span>' + head + '</div>' +
    '<h1>' + esc(big) + '</h1><div class="sub">' + esc(sub) + '</div>' +
    '<div class="dest">📍 ' + esc(last.dest || "Destination") + '</div>' +
    '<div class="note">Updated ' + (ago < 60 ? ago + " s" : Math.round(ago / 60) + " min") + ' ago · shared from GameRoute</div>';
  car.setLatLng([last.lat, last.lon]).addTo(map);
  if (last.dlat) dest.setLatLng([last.dlat, last.dlon]).addTo(map);
  if (!fitted && last.dlat) { map.fitBounds([[last.lat, last.lon], [last.dlat, last.dlon]], { padding: [60, 60] }); fitted = true; }
  else if (!fitted) { map.setView([last.lat, last.lon], 14); fitted = true; }
}

async function take(msg) {
  const plain = await openMsg(key, msg.message); if (!plain) return;
  try { const d = JSON.parse(plain); if (!last || d.ts >= last.ts) { last = d; render(); } } catch (e) {}
}

if (!topic || !keyText) {
  card.innerHTML = '<div class="wait">This link is missing its code. Ask for a new one.</div>';
} else crypto.subtle.importKey("raw", unb64(keyText), "AES-GCM", false, ["decrypt"]).then(k => {
  key = k;
  fetch("https://ntfy.sh/" + topic + "/json?poll=1&since=12h").then(r => r.text()).then(t => {
    t.split("\n").filter(Boolean).forEach(l => { try { const m = JSON.parse(l); if (m.event === "message") feed(m); } catch (e) {} });
    chain = chain.then(() => { if (!last) card.innerHTML = '<div class="wait">Waiting for the driver\'s first update…</div>'; });
  }).catch(() => {});
  const es = new EventSource("https://ntfy.sh/" + topic + "/sse");
  es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === "message") feed(m); } catch (x) {} };
  setInterval(render, 15000);
}).catch(() => { card.innerHTML = '<div class="wait">This link is damaged. Ask for a new one.</div>'; });
</script>
</body>
</html>
