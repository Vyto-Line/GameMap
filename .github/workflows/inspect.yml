name: Inspect releases
# Prints package, version, target SDK and signing certificate of a few released APKs.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags, space separated"
        default: "build-54 build-58 build-59 build-60"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for t in ${{ inputs.tags }}; do
            echo "=== $t"
            gh release download "$t" -R "${{ github.repository }}" -p "*.apk" -D "a_$t" --clobber || continue
            f=$(ls a_$t/*.apk | head -1)
            ls -la "$f"
            "$BT/aapt2" dump badging "$f" | grep -E "^package|targetSdk|sdkVersion|application-debuggable|testOnly" || true
            "$BT/apksigner" verify --print-certs "$f" 2>&1 | grep -E "SHA-256|DOES NOT|ERROR" | head -3
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$f" | grep -E "E: (queries|package|provider|uses-permission|intent)|A: .*name.*(INSTALL|unknownauto|Update|package-archive)|testOnly|extractNativeLibs" | head -30
          done
