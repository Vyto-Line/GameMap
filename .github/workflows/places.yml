name: Places data
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe or build"
        default: "probe"
permissions:
  contents: write
jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install duckdb==1.1.3
      - name: Probe
        if: inputs.mode == 'probe'
        run: python3 tools/places_probe.py 2>&1 | tee probe.txt
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'probe'
        with: { name: probe, path: probe.txt }
