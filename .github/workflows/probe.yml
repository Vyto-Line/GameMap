name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe APIs
        run: |
          set +e
          echo "== photon osm_tag =="
          for q in fuel restaurant parking; do
            tag=$( [ $q = fuel ] && echo amenity:fuel || ([ $q = restaurant ] && echo amenity:restaurant || echo amenity:parking) )
            curl -s -m 20 "https://photon.komoot.io/api/?q=$q&osm_tag=$tag&lat=37.984&lon=23.728&limit=5&location_bias_scale=0.9&zoom=16" | python3 -c "
          import json,sys;o=json.load(sys.stdin);f=o.get('features',[])
          print('$q',len(f),[ (x['properties'].get('name'),x['properties'].get('osm_value'),x['geometry']['coordinates']) for x in f[:5]])"
          done
          echo "== nominatim amenity =="
          curl -s -m 20 -A "GameMap-probe" "https://nominatim.openstreetmap.org/search?amenity=fuel&viewbox=23.70,38.00,23.76,37.97&bounded=1&format=jsonv2&limit=5" | python3 -c "
          import json,sys;a=json.load(sys.stdin);print(len(a),[(x.get('name'),x.get('type'),x['lat'],x['lon']) for x in a[:5]])"
          echo "== osrm exclude =="
          for ex in toll motorway "toll,motorway"; do
            curl -s -m 20 "https://router.project-osrm.org/route/v1/driving/23.7275,37.9838;23.65,37.94?overview=false&exclude=$ex" | python3 -c "
          import json,sys;o=json.load(sys.stdin);print('$ex',o.get('code'),o.get('message'),[ (r['distance'],r['duration']) for r in o.get('routes',[])])"
          done
