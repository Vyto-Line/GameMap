name: Probe traffic
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe TomTom vector flow tiles
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          pip install mapbox-vector-tile >/dev/null 2>&1
          cat > p.py <<'PY'
          import os, urllib.request, gzip, collections, mapbox_vector_tile as mvt
          K=os.environ["TOMTOM_KEY"]
          for style in ["relative","relative-delay"]:
            for z,x,y in [(14,9271,6321),(16,37086,25286),(12,2317,1580)]:
              u=f"https://api.tomtom.com/traffic/map/4/tile/flow/{style}/{z}/{x}/{y}.pbf?key={K}"
              try:
                r=urllib.request.urlopen(urllib.request.Request(u,headers={"Accept-Encoding":"gzip"}),timeout=20); b=r.read()
                if b[:2]==b"\x1f\x8b": b=gzip.decompress(b)
                d=mvt.decode(b)
                print(f"TILE {style} {z}/{x}/{y} {len(b)/1e3:.0f}KB layers={list(d)}")
                for ln,l in d.items():
                  fs=l["features"]; print("   layer",ln,"n",len(fs),"extent",l.get("extent"),"types",collections.Counter(f["geometry"]["type"] for f in fs))
                  keys=collections.Counter(k for f in fs for k in f["properties"]); print("   keys",keys.most_common(15))
                  for k in list(keys)[:12]:
                    vals=collections.Counter(str(f["properties"].get(k))[:12] for f in fs)
                    print("     ",k,vals.most_common(8))
                  if fs:
                    g=fs[0]["geometry"]; print("   sample geometry", str(g)[:160])
              except Exception as e: print("TILE",style,z,x,y,"FAIL",str(e).replace(K,"***")[:200])
          PY
          python3 p.py
