name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe APIs
        run: |
          set +e
          Q='[out:json][timeout:25];(node["highway"="speed_camera"](37.75,23.45,38.20,24.05);node["enforcement"="maxspeed"](37.75,23.45,38.20,24.05););out;'
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.private.coffee/api/interpreter; do
            start=$(date +%s.%N)
            code=$(curl -s -m 40 -o out.json -w "%{http_code}" --data-urlencode "data=$Q" -A "GameMap/1.0" "$ep")
            end=$(date +%s.%N)
            n=$(python3 -c "import json;print(len(json.load(open('out.json'))['elements']))" 2>/dev/null)
            echo "$ep -> $code n=$n t=$(echo "$end - $start" | bc)"
          done
          python3 -c "import json;e=json.load(open('out.json'))['elements'];print([x.get('tags') for x in e[:4]])" 2>/dev/null
