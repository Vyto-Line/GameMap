name: Probe Overpass
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          cat > p.py <<'PY'
          import math, json, time, urllib.request, urllib.parse, concurrent.futures as cf
          def lon(x, w): return x / w * 360 - 180
          def lat(y, w): return math.degrees(math.atan(math.sinh(math.pi * (1 - 2 * y / w))))
          W = 256 * 2**15
          def bbox(ax, ay): return lat((ay+1)*256, W), lon(ax*256, W), lat(ay*256, W), lon((ax+1)*256, W)
          FULL = "way[building];way[highway];way[waterway];way[natural];way[landuse];way[leisure];way[amenity=parking];relation[natural=water];relation[landuse];relation[leisure];relation[building];"
          SLIM = "way[building];way[highway];way[waterway];way[natural~\"^(water|coastline|wood|scrub|beach|sand|bare_rock)$\"];way[landuse];way[leisure];relation[natural=water];"
          def q(ax, ay, body, ep="https://overpass-api.de/api/interpreter"):
              s,w,n,e = bbox(ax, ay)
              data = f"[out:json][timeout:25][bbox:{s},{w},{n},{e}];({body});out geom qt;"
              t = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(ep, data=urllib.parse.urlencode({"data": data}).encode(), headers={"User-Agent":"GameMap probe"}), timeout=60)
                  raw = r.read(); j = json.loads(raw)
                  els = j.get("elements", [])
                  kinds = {}
                  for el in els:
                      tg = el.get("tags", {})
                      k = "building" if "building" in tg else "highway" if "highway" in tg else (list(tg)[0] if tg else "?")
                      kinds[k] = kinds.get(k, 0) + 1
                  return f"{ep.split('/')[2]} {ax},{ay} 200 {len(raw)/1e6:.2f}MB {len(els)} els {time.time()-t:.1f}s remark={j.get('remark','')[:80]} top={sorted(kinds.items(), key=lambda x:-x[1])[:6]}"
              except Exception as ex:
                  return f"{ep.split('/')[2]} {ax},{ay} FAIL {ex} {time.time()-t:.1f}s"
          print("FULL  ", q(18544, 12644, FULL))
          print("SLIM  ", q(18544, 12644, SLIM))
          print("KUMI  ", q(18544, 12644, SLIM, "https://overpass.kumi.systems/api/interpreter"))
          print("PRIVATE", q(18544, 12644, SLIM, "https://overpass.private.coffee/api/interpreter"))
          with cf.ThreadPoolExecutor(4) as ex:
              for r in ex.map(lambda a: q(a[0], a[1], SLIM), [(18545,12644),(18544,12645),(18545,12645),(18543,12644)]):
                  print("PAR   ", r)
          # coastal area (Piraeus / Faliro)
          print("COAST ", q(18536, 12651, SLIM))
          PY
          python3 p.py
