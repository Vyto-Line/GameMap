name: Probe Overpass
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode a real tile with the app's reader
        run: |
          which kotlinc && kotlinc -version 2>&1 | tail -1
          T=$(curl -s https://tiles.openfreemap.org/planet | python3 -c "import sys,json;print(json.load(sys.stdin)['tiles'][0])")
          curl -s --compressed -o athens.pbf "$(echo $T | sed 's/{z}/14/;s/{x}/9272/;s/{y}/6322/')"
          curl -s --compressed -o coast.pbf "$(echo $T | sed 's/{z}/14/;s/{x}/9268/;s/{y}/6325/')"
          ls -la *.pbf
          mkdir t && sed 's/^package gr.gamemap//' app/src/main/java/gr/gamemap/VectorTile.kt > t/VectorTile.kt
          cat > t/Main.kt <<'KT'
          import java.io.File
          fun main(args: Array<String>) {
              for (f in args) {
                  val vt = VectorTile(File(f).readBytes())
                  println("FILE $f features=${vt.features.size}")
                  vt.features.groupBy { it.layer }.forEach { (l, fs) ->
                      val parts = fs.sumOf { it.parts.size }
                      val cls = fs.groupingBy { it["class"] + "/" + it.type }.eachCount().entries.sortedByDescending { it.value }.take(6)
                      println("  $l n=${fs.size} parts=$parts ext=${fs.first().extent} $cls")
                  }
                  val b = vt.features.filter { it.layer == "building" }.flatMap { it.parts }
                  var pos = 0; var neg = 0
                  for (p in b) { var a = 0f; var i = 0; while (i < p.size) { val j = (i + 2) % p.size; a += p[i] * p[j + 1] - p[j] * p[i + 1]; i += 2 }; if (a >= 0) pos++ else neg++ }
                  println("  building rings: exterior=$pos holes=$neg sample=${b.firstOrNull()?.take(8)}")
              }
          }
          KT
          kotlinc t/*.kt -include-runtime -d t.jar 2>&1 | grep -v warning | tail -5
          java -jar t.jar athens.pbf coast.pbf
