name: Probe Overpass
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          pip install mapbox-vector-tile >/dev/null 2>&1
          cat > p.py <<'PY'
          import json, time, urllib.request, gzip, collections
          import mapbox_vector_tile as mvt
          def get(u):
              t=time.time(); r=urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"GameMap probe","Accept-Encoding":"gzip"}), timeout=30)
              b=r.read(); enc=r.headers.get("Content-Encoding"); 
              if b[:2]==b"\x1f\x8b": b=gzip.decompress(b)
              return b, time.time()-t, enc, r.headers.get("Content-Type")
          tj, dt, enc, ct = get("https://tiles.openfreemap.org/planet")
          j=json.loads(tj); print("TILEJSON", dt, j.get("tiles"), "maxzoom", j.get("maxzoom"))
          tmpl=j["tiles"][0]
          for name,(z,x,y) in {"athens":(14,9272,6322),"coast":(14,9268,6325),"athens13":(13,4636,3161)}.items():
              b, dt, enc, ct = get(tmpl.replace("{z}",str(z)).replace("{x}",str(x)).replace("{y}",str(y)))
              d = mvt.decode(b)
              print("TILE", name, z, x, y, f"{len(b)/1e3:.0f}KB {dt:.2f}s enc={enc} ct={ct}")
              for ln, layer in d.items():
                  feats = layer["features"]
                  cls = collections.Counter((f["properties"].get("class"), f["geometry"]["type"]) for f in feats)
                  print("  ", ln, "extent", layer.get("extent"), "n", len(feats), cls.most_common(12))
                  if ln=="transportation":
                      print("     brunnel", collections.Counter(f["properties"].get("brunnel") for f in feats).most_common(4), "sub", collections.Counter(f["properties"].get("subclass") for f in feats).most_common(10))
                  if ln=="building" and feats: print("     building props", list(feats[0]["properties"].keys())[:10])
          PY
          python3 p.py
