name: Build APK
# Builds only when a version tag (v1.2, v2.0, ...) is pushed or when started by hand
# from the Actions tab. Each build becomes its own release; nothing is deleted.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        run: git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" src
      - name: Set up Gradle 8.14 (the Android plugin doesn't work with Gradle 9.6+ yet)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Check TomTom key (prints status codes only)
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          if [ -z "$TOMTOM_KEY" ]; then echo "KEYCHECK secret TOMTOM_KEY: MISSING"; exit 0; fi
          echo "KEYCHECK secret TOMTOM_KEY: present (${#TOMTOM_KEY} characters)"
          t=$(curl -s -o /dev/null -w "%{http_code}" "https://api.tomtom.com/traffic/map/4/tile/flow/relative0/12/2338/1588.png?key=$TOMTOM_KEY")
          r=$(curl -s -o /dev/null -w "%{http_code}" "https://api.tomtom.com/routing/1/calculateRoute/37.9755,23.7348:37.9420,23.6470/json?key=$TOMTOM_KEY&traffic=true&routeRepresentation=summaryOnly")
          echo "KEYCHECK traffic tiles: HTTP $t"
          echo "KEYCHECK routing: HTTP $r"
      - name: Build APK
        working-directory: src
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          REPORTS_URL: ${{ secrets.REPORTS_URL }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          # a release build (not debuggable): Android compiles and runs it faster
          gradle assembleGithubRelease --no-daemon -PbuildNumber=${{ github.run_number }}
          mkdir -p ../out && cp app/build/outputs/apk/github/release/*.apk ../out/GameRoute.apk
      - name: Build Play Store bundle
        working-directory: src
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          REPORTS_URL: ${{ secrets.REPORTS_URL }}
          PLAY_KEYSTORE: ${{ secrets.PLAY_KEYSTORE }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          if [ -n "$PLAY_KEYSTORE" ]; then
            echo "$PLAY_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export PLAY_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          fi
          gradle bundlePlayRelease --no-daemon -PbuildNumber=${{ github.run_number }}
          rm -f "$RUNNER_TEMP/upload.jks"
          # only a signed bundle can go to Play; without the key this step just checks the Play version builds
          if [ -n "$PLAY_KEYSTORE" ]; then cp app/build/outputs/bundle/playRelease/*.aab ../out/GameRoute-play.aab
          else echo "No PLAY_KEYSTORE secret: the Play bundle was built but not signed, so it isn't attached"; fi
      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}"
          gh release create "$TAG" out/GameRoute.apk $(ls out/GameRoute-play.aab 2>/dev/null) -R "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "GameRoute $TAG" --notes "Automatic build. versionCode: ${{ github.run_number }}"
