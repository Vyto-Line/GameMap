name: Camera data
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays
  workflow_dispatch:
    inputs:
      countries:
        description: "Country codes"
        default: "GR CY BG"
permissions:
  contents: write
jobs:
  cameras:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Previous data
        run: |
          mkdir -p out
          git fetch -q origin data && git --work-tree=out checkout origin/data -- . || true
          ls -R out | head
      - name: Export from OpenStreetMap
        run: python3 tools/cameras.py ${{ inputs.countries || 'GR CY BG' }}
      - name: Publish to data branch
        run: |
          cd out
          git init -q && git checkout -q -b data
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "Camera data $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          cat cameras/index.json
